[General]
# `current` is a symlink created by sddm/install.sh to the user's ~/.cache/hush/sddm,
# which `hush sddm sync` refreshes on every theme, wallpaper or `hush face` change.
background=current/wallpaper.png
colorsQml=current/colors.qml
layoutQml=current/layout.qml
avatar=current/face.png
fallbackAvatar=assets/avatar.png
font=Inter
# Tests only (sddm-greeter --test-mode has no daemon): fail or succeed stands in for the login reply.
testAuth=
