# Hush lock (Quickshell, hyprlock fallback) and login (SDDM) screen.
# One spec for every screen. cy = centre of the element as a fraction of the screen height H.
# Sizes are pixels at H = 1080 and scale by s = H / 1080 (lengths rounded to even pixels).
# `hush reload` / `hush lock` turn this into ~/.config/hush/hyprlock-layout.conf (one block set per
# monitor, % positions) and ~/.config/hush/lock-layout.qml, `hush sddm sync` into
# ~/.cache/hush/sddm/layout.qml for the greeter. Keys marked login are the greeter's only.

base = 1080

[clock]
cy = 0.32          # 346 px: centre of the figures
size = 160
weight = 100       # Inter Thin, proportional figures
tracking = -4.8    # -0.03 em
stack = 0          # stacked: line pitch of HH over MM as a fraction of size; 0 = one line

[date]
cy = 0.4033        # 24 px under the figures
size = 16
weight = 500
tracking = 4.8     # 0.3 em, capitals

[user]
cy = 0.6435        # 28 px above the pill
size = 13
tracking = 3.25    # 0.25 em, capitals

[pill]
cy = 0.70          # 756 px
w = 340
h = 56
outline_alpha = 0.12

[avatar]           # login: inside the pill at the left
size = 32

[field]
dot = 8
dot_gap = 10

[submit]           # login
size = 40
inset = 8

[status]
cy = 0.7546        # 24 px under the pill: fingerprint prompt, wrong password
size = 14

[icons]            # battery and network glyphs, top right
top = 49           # centre y, px from the top
right = 40
size = 18

[power]            # login: session, sleep, power
cy = 0.9333        # 1008 px
size = 40
gap = 12
menu_item = 36

[blur]             # the wallpaper: blurred, multiplied by brightness, a little desaturated
radius = 24        # px (the screen; hyprlock approximates it with passes and size)
brightness = 0.6
brightness_light = 0.3   # light themes (state.json mode): white text needs a dark wall
saturation = 0.85  # the screen
passes = 3         # hyprlock
size = 8
contrast = 0.95
vibrancy = 0.20         # hyprlock: keeps the wallpaper colour (harbor teal, dusk purple) under the dim
vibrancy_darkness = 0.10
noise = 0.011

[motion]
fade_ms = 250
submit_ms = 100
check_ms = 260
error_ms = 600
shake_ms = 300
shake_px = 8
success_ms = 300
success_lift = 24

# settings.json lock.clock: "quiet" is the values above; "bold" and "stacked"
# replace these. hyprlock takes their size, weight and tracking only (one clock line, usual places).
[style.bold]
clock = { size = 150, weight = 800, tracking = -6 }   # -0.04 em
date = { cy = 0.3996, weight = 600, tracking = 4 }    # 24 px under the shorter figures, 0.25 em

[style.stacked]
clock = { cy = 0.38, size = 200, tracking = -6, stack = 0.85 }  # cy: the HH-over-MM block, cap top to baseline
date = { cy = 0.5683, tracking = 8 }                  # 40 px under MM, 0.5 em
user = { cy = 0.7035 }                                # the pill and its name and status move down 6 %
pill = { cy = 0.76 }
status = { cy = 0.8146 }
