# Hush lock screen, Apple style. Colours come from colors.conf (matugen), wallpaper from hyprlock-wall.conf.
# $HOME/.cache/hush/face.png is ~/.face when present, else the brand avatar (written by `hush reload`).

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 3, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = $wall
    blur_passes = 2
    blur_size = 7
    noise = 0.011
    contrast = 0.85
    brightness = 0.55
    vibrancy = 0.15
    vibrancy_darkness = 0.2
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $hushOnSurfaceMain
    font_size = 96
    font_family = Inter Variable Light
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = $hushSurfaceBase
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $hushOnSurfaceMain
    font_size = 20
    font_family = Inter Variable
    position = 0, 105
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
    shadow_color = $hushSurfaceBase
}

# Avatar
image {
    monitor =
    path = $HOME/.cache/hush/face.png
    size = 88
    rounding = -1
    border_size = 2
    border_color = $hushPrimary
    position = 0, -10
    halign = center
    valign = center
}

# Password pill
input-field {
    monitor =
    size = 300, 48
    rounding = -1
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $hushPrimary
    check_color = $hushPrimary
    fail_color = $hushError
    inner_color = $hushSurfaceCont
    font_color = $hushOnSurfaceMain
    font_family = Inter Variable
    fade_on_empty = false
    placeholder_text = Enter password
    fail_text = Wrong password
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $hushSurfaceBase
}

# Fingerprint hint ($FPRINTPROMPT is empty without fprintd)
label {
    monitor =
    text = $FPRINTPROMPT
    color = $hushOnSurfaceMain
    font_size = 14
    font_family = Inter Variable
    position = 0, -150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $hushSurfaceBase
}

# Media line, only while something plays
label {
    monitor =
    text = cmd[update:2000] $HOME/.config/hyprlock/media-line.sh
    color = $hushOnSurfaceMain
    font_size = 14
    font_family = Inter Variable
    position = 0, 48
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $hushSurfaceBase
}

auth {
    fingerprint {
        enabled = true
        ready_message = Touch the sensor to unlock
        present_message = Scanning...
    }
}
