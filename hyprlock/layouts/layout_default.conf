# BACKGROUND
background {
    monitor =
    path = $wall
    blur_passes = 2
    blur_size = 6
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $hushOnSurfaceMain
    font_size = 96
    font_family = Inter
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $hushSurfaceBase
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $hushOnSurfaceVar
    font_size = 22
    font_family = Inter
    position = 0, 40
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $hushSurfaceBase
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $hushPrimary
    check_color = $hushPrimary
    fail_color = $hushError
    inner_color = $hushSurfaceCont
    font_color = $hushOnSurfaceMain
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $hushSurfaceBase
}

# AUTHENTICATION
auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint...
        present_message = Scanning...
    }
}
