# Hush lock screen, layout B "island-native": a thin clock over the blurred wallpaper and one black
# pill (avatar, password, caps/fingerprint glyphs) the same black as the bar island.
# The background and every widget come from lockscreen/layout.toml through `hush reload`, which
# writes ~/.config/hush/hyprlock-layout.conf (sourced by hyprlock.conf); this file holds the rest.
# Colours: colors.conf (matugen). Avatar: ~/.cache/hush/face.png (`hush face`, else the brand mark).

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = outQuint, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 2.5, outQuint
    animation = fadeOut, 1, 2.5, outQuint
    animation = inputFieldColors, 1, 3, outQuint
    animation = inputFieldDots, 1, 2, outQuint
    # hyprlock 0.9.6 has inputFieldWidth, but it only animates the field growing to fit a long
    # placeholder or fail text; there is no focus or typing width morph to drive.
    animation = inputFieldWidth, 1, 3, outQuint
}

auth {
    fingerprint {
        enabled = true
        # Shown in Material Symbols at the pill's right end: the ligature draws the glyph.
        ready_message = fingerprint
        present_message = fingerprint
    }
}
