# ANSI palette: hue-pinned from the mode-aware primary (tone 80 on dark, tone 40 on light) so every
# accent keeps readable contrast on both the dark and the light kitty background. base16 is not used:
# on wallpaper-sourced themes it collapses to near-background colors (contrast ~1.0).
# bright variants use auto_lightness -10 (brighter on dark, darker on light = more contrast, never less).
color0  {{colors.surface_container_high.default.hex}}
color1  {{colors.primary.default.hex | set_hue: 5.0 | set_saturation: 65.0}}
color2  {{colors.primary.default.hex | set_hue: 125.0 | set_saturation: 65.0}}
color3  {{colors.primary.default.hex | set_hue: 45.0 | set_saturation: 65.0}}
