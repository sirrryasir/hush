# Generated by matugen for Hush.
# Names are chosen so that no variable is a prefix of another (hyprlang substitutes by prefix).
$hushSurfaceBase = rgba({{colors.surface.default.hex_stripped}}ff)
$hushSurfaceCont = rgba({{colors.surface_container.default.hex_stripped}}ff)
$hushSurfaceHigh = rgba({{colors.surface_container_high.default.hex_stripped}}ff)
$hushOnSurfaceMain = rgba({{colors.on_surface.default.hex_stripped}}ff)
$hushOnSurfaceVar = rgba({{colors.on_surface_variant.default.hex_stripped}}ff)
$hushPrimary = rgba({{colors.primary.default.hex_stripped}}ff)
$hushOnPrimary = rgba({{colors.on_primary.default.hex_stripped}}ff)
$hushOutline = rgba({{colors.outline.default.hex_stripped}}ff)
$hushError = rgba({{colors.error.default.hex_stripped}}ff)
# Labels drawn straight on the wallpaper. The lock background is always darkened (brightness in
# the layout), so these stay the dark-scheme text and shade even in light themes, where the
# mode's dark on_surface would sit on a dimmed wallpaper at ~3:1.
$hushWallText = rgba({{colors.on_surface.dark.hex_stripped}}ff)
$hushWallShade = rgba({{colors.surface.dark.hex_stripped}}ff)
