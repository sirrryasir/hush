# Hush boot menu, included from refind.conf by install.sh. Paths are relative to the rEFInd directory.
# the theme's wallpaper, blurred and dimmed (rendered by install.sh)
banner themes/hush/banner.png
# stretched over the whole screen
banner_scale fillscreen
# white glyphs; any missing one falls back to the stock set
# NixOS logo: NixOS/nixos-artwork, CC BY 4.0
# Atlas logo: Atlas-OS, see docs.atlasos.net/branding
icons_dir themes/hush/icons
# OS icons
big_icon_size 128
# tool icons
small_icon_size 48
# small triangle under the chosen OS
selection_big themes/hush/selection_big.png
# the same marker for the tools
selection_small themes/hush/selection_small.png
# OS glyphs and the marker only, no text
hideui singleuser,hints,arrows,badges,hwtest,label,editor
# two small icons under the row
showtools shutdown,reboot
# native panel resolution
resolution max
